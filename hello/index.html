<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello World</title>
<meta name="theme-color" content="#141826">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hello">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#141826;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;box-sizing:border-box;text-align:center}
  h1{font-size:clamp(40px,12vw,72px);margin:0;letter-spacing:-1px}
  p{margin:0;color:#9aa4bf}
  button{margin-top:12px;font:inherit;padding:12px 24px;border:0;border-radius:999px;background:#6ec8ff;color:#141826;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Hello, World!</h1>
  <p id="msg">justvapor의 첫 번째 앱</p>
  <button id="btn">눌러보기</button>
</main>
<script>
  let n = 0;
  document.getElementById('btn').onclick = () => {
    n++; document.getElementById('msg').textContent = `안녕하세요 👋 (${n}번 눌렀어요)`;
  };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
